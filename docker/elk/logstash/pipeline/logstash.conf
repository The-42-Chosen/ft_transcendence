
input {
  file {
    path => "/var/log/nginx/access.json.log"
    type => "nginx.access"
  }

  file {
    path => "/var/log/nginx/error.log"
    type => "nginx.error"
  }

  # Porte d'entree generique pour les logs applicatifs (futur backend) :
  tcp {
    port => 5000
    codec => json_lines
    type => "app"
  }
}

filter {
  if [type] == "nginx.access" {
    json {
      source => "message"
      remove_field => ["message"]
    }
    date {
      match => ["time", "ISO8601"]
      remove_field => ["time"]
    }
    mutate {
      convert => {
        "status"       => "integer"
        "bytes"        => "integer"
        "request_time" => "float"
      }
    }
  }

  if [type] == "nginx.error" {
    grok {
      match => {
        "message" => "%{DATA:time} \[%{DATA:severity}\] %{GREEDYDATA:error_message}"
      }
      tag_on_failure => []
    }
    date {
      match => ["time", "yyyy/MM/dd HH:mm:ss"]
      remove_field => ["time"]
    }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"

    # cycle de vie gere par la politique ILM retention 30 jours
    ilm_enabled        => true
    ilm_rollover_alias => "transcendence-logs"
    ilm_pattern        => "000001"
    ilm_policy         => "transcendence-logs"
  }
}
