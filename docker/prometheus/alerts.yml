# Regles d'alerte evaluees par Prometheus toutes les 15s.
# Visibles dans l'onglet "Alerts" de Prometheus et via la metrique ALERTS
# (affichable dans Grafana). L'envoi de notifications passerait par
# Alertmanager ou par l'alerting integre de Grafana.

groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} ne repond plus depuis 1 minute"

  - name: resources
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU de la machine > 90% depuis 5 minutes"

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAM de la machine > 90% depuis 5 minutes"

      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disque {{ $labels.mountpoint }} rempli a plus de 85%"

  - name: postgres
    rules:
      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 80 connexions actives sur PostgreSQL"
