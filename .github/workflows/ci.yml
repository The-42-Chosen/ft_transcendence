name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valider la syntaxe du docker-compose et des overrides CI
        run: |
          docker compose -f docker-compose.yml config -q
          for job in app monitoring elk; do
            docker compose -f docker-compose.yml -f ".github/ci/$job.yml" config -q
          done

      # promtool check config verifie aussi les fichiers listes dans rule_files
      - name: Valider la config et les regles Prometheus
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/docker/prometheus:/etc/prometheus:ro" \
            docker.io/prom/prometheus:v3.2.1 \
            check config /etc/prometheus/prometheus.yml

      # Rejoue des series fictives contre alerts.yml, sans demarrer de conteneur
      - name: Tester les regles d'alerte
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/docker/prometheus:/etc/prometheus:ro" \
            docker.io/prom/prometheus:v3.2.1 \
            test rules /etc/prometheus/alerts_test.yml

      - name: Valider les JSON des dashboards Grafana
        run: jq empty docker/grafana/dashboards/*.json

      - name: Valider la syntaxe des scripts shell
        run: bash -n docker/elk/setup/setup.sh docker/postgres/init/02-monitoring-user.sh .github/ci/wait-all.sh

  # ---------------------------------------------------------------------------
  # postgres + next + nginx : la partie applicative
  # ---------------------------------------------------------------------------
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Creer le .env (valeurs factices pour la CI)
        run: cp .env.example .env

      - name: Preparer buildx (necessaire pour exporter le cache de build)
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image Next (avec cache)
        uses: docker/build-push-action@v6
        with:
          context: ./docker/next
          tags: transcendence-next:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Demarrer postgres, next et nginx
        run: |
          docker compose -f docker-compose.yml -f .github/ci/app.yml \
            up -d --no-deps postgres next nginx grafana kibana

      - name: Attendre que tout reponde
        run: |
          .github/ci/wait-all.sh 180 \
            "postgres healthy=docker inspect -f '{{.State.Health.Status}}' postgres | grep -qx healthy" \
            "next healthy=docker inspect -f '{{.State.Health.Status}}' next | grep -qx healthy" \
            "nginx redirige http vers https=curl -fsS -o /dev/null http://localhost:8080" \
            "nginx proxifie next en https=curl -fsk -o /dev/null https://localhost:8443/api/health"

      - name: Verifier que postgres repond aux requetes
        run: docker exec postgres psql -U transcendence -d transcendence -c 'SELECT 1'

      - name: Verifier la conf nginx rendue (templates + env)
        run: docker exec nginx nginx -t

      - name: Logs en cas d'echec
        if: failure()
        run: docker compose -f docker-compose.yml -f .github/ci/app.yml logs

  # ---------------------------------------------------------------------------
  # prometheus + grafana + exporters : la supervision hors ELK
  # ---------------------------------------------------------------------------
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Creer le .env (valeurs factices pour la CI)
        run: cp .env.example .env

      # next et kibana sont des stubs ; postgres est necessaire a postgres-exporter.
      - name: Demarrer prometheus, grafana et les exporters
        run: |
          docker compose -f docker-compose.yml -f .github/ci/monitoring.yml \
            up -d --no-deps prometheus grafana node-exporter cadvisor \
                 postgres postgres-exporter nginx nginx-exporter next kibana

      # Les cibles elasticsearch et les sondes blackbox sont testees par le job elk.
      - name: Attendre que tout reponde
        run: |
          set -a; source .env; set +a
          expected=$(ls docker/grafana/dashboards/*.json | wc -l)
          .github/ci/wait-all.sh 180 \
            "cibles prometheus up (hors ELK)=docker exec prometheus wget -qO- localhost:9090/api/v1/targets \
               | jq -e '[.data.activeTargets[] | select(.labels.job != \"elasticsearch\" and .labels.job != \"probes\")] \
                        | length > 0 and all(.health == \"up\")'" \
            "grafana derriere nginx (https + sous-chemin)=curl -fsk -o /dev/null https://localhost:8443/grafana/api/health" \
            "dashboards grafana provisionnes ($expected)=curl -fsk -u \"$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD\" \
               'https://localhost:8443/grafana/api/search?type=dash-db' | jq -e 'length >= $expected'"

      - name: Etat des cibles Prometheus en cas d'echec
        if: failure()
        run: |
          docker exec prometheus wget -qO- localhost:9090/api/v1/targets \
            | jq '.data.activeTargets[] | {job: .labels.job, health: .health, lastError: .lastError}' || true
          docker compose -f docker-compose.yml -f .github/ci/monitoring.yml logs

  # ---------------------------------------------------------------------------
  # elasticsearch + elk-setup + logstash + kibana + nginx : la chaine de logs,
  # plus prometheus / blackbox / elasticsearch-exporter pour les sondes ELK
  # ---------------------------------------------------------------------------
  elk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Creer le .env (valeurs factices pour la CI)
        run: cp .env.example .env

      - name: Augmenter vm.max_map_count pour Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Demarrer la chaine ELK
        run: |
          docker compose -f docker-compose.yml -f .github/ci/elk.yml \
            up -d --no-deps elasticsearch elk-setup logstash kibana nginx next grafana \
                 prometheus blackbox-exporter elasticsearch-exporter

      - name: Attendre que tout reponde
        run: |
          set -a; source .env; set +a
          .github/ci/wait-all.sh 420 \
            "elasticsearch healthy=docker inspect -f '{{.State.Health.Status}}' elasticsearch | grep -qx healthy" \
            "elk-setup termine (comptes, ILM, SLM, data view)=s=\$(docker inspect -f '{{.State.Status}}/{{.State.ExitCode}}' elk-setup); \
               [ \"\$s\" = exited/0 ] && exit 0; case \"\$s\" in exited/*) docker logs elk-setup; exit 2;; esac; exit 1" \
            "pipeline nginx -> logstash -> elasticsearch=curl -fsk -o /dev/null https://localhost:8443/ || true; \
               docker exec elasticsearch curl -fsS -u \"elastic:$ELASTIC_PASSWORD\" 'localhost:9200/transcendence-logs*/_count' \
               | jq -e '.count > 0'" \
            "kibana derriere nginx (https + sous-chemin + login kibana_user)=curl -fsk -o /dev/null \
               -u \"kibana_user:$KIBANA_USER_PASSWORD\" https://localhost:8443/kibana/api/status" \
            "cibles prometheus elasticsearch + sondes logstash/kibana up=docker exec prometheus wget -qO- localhost:9090/api/v1/targets \
               | jq -e '[.data.activeTargets[] | select(.labels.job == \"elasticsearch\" or (.labels.job == \"probes\" and .labels.probe != \"next\"))] \
                        | length == 3 and all(.health == \"up\")'" \
            "sondes blackbox logstash et kibana vertes=docker exec prometheus wget -qO- 'localhost:9090/api/v1/query?query=probe_success' \
               | jq -e '[.data.result[] | select(.metric.probe != \"next\")] | length == 2 and all(.value[1] == \"1\")'"

      - name: Logs en cas d'echec
        if: failure()
        run: |
          docker exec prometheus wget -qO- 'localhost:9090/api/v1/query?query=probe_success' | jq . || true
          docker logs logstash --tail 50 || true
          docker compose -f docker-compose.yml -f .github/ci/elk.yml logs
