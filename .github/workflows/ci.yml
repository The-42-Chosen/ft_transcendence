name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Deux push rapproches sur une meme PR : seul le dernier run est conserve.
# Sur dev et main, chaque commit garde son run complet.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valider la syntaxe du docker-compose
        run: docker compose -f docker-compose.yml config

      # promtool check config verifie aussi les fichiers listes dans rule_files
      - name: Valider la config et les regles Prometheus
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/docker/prometheus:/etc/prometheus:ro" \
            docker.io/prom/prometheus:v3.2.1 \
            check config /etc/prometheus/prometheus.yml

      # Rejoue des series fictives contre alerts.yml, sans demarrer de conteneur
      - name: Tester les regles d'alerte
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/docker/prometheus:/etc/prometheus:ro" \
            docker.io/prom/prometheus:v3.2.1 \
            test rules /etc/prometheus/alerts_test.yml

      - name: Valider les JSON des dashboards Grafana
        run: jq empty docker/grafana/dashboards/*.json

      - name: Valider la syntaxe des scripts shell
        run: bash -n docker/elk/setup/setup.sh docker/postgres/init/02-monitoring-user.sh

  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Creer le .env (valeurs factices pour la CI)
        run: cp .env.example .env

      - name: Augmenter vm.max_map_count pour Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Demarrer la stack
        run: docker compose up -d --build

      - name: Attendre que postgres soit healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' postgres 2>/dev/null || echo "absent")
            echo "postgres: $status (tentative $i/30)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::postgres n'est jamais devenu healthy"
          exit 1

      - name: Verifier que postgres repond aux requetes
        run: docker exec postgres psql -U transcendence -d transcendence -c 'SELECT 1'

      - name: Verifier que nginx repond
        run: curl -fsS --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080 -o /dev/null

      - name: Verifier la conf nginx rendue (templates + env)
        run: docker exec nginx nginx -t

      - name: Verifier que toutes les cibles Prometheus sont up
        run: |
          for i in $(seq 1 20); do
            if docker exec prometheus wget -qO- localhost:9090/api/v1/targets \
               | jq -e '[.data.activeTargets[] | select(.health != "up")] | length == 0' > /dev/null; then
              echo "Toutes les cibles sont up"
              exit 0
            fi
            echo "Cibles pas encore toutes up (tentative $i/20)"
            sleep 3
          done
          echo "::error::Des cibles Prometheus sont restees down"
          docker exec prometheus wget -qO- localhost:9090/api/v1/targets \
            | jq '.data.activeTargets[] | {job: .labels.job, health: .health, lastError: .lastError}'
          exit 1

      - name: Verifier Grafana derriere nginx (HTTPS + sous-chemin)
        run: curl -fsk --retry 5 --retry-delay 2 --retry-connrefused https://localhost:8443/grafana/api/health

      # /api/health repond OK meme si Grafana a ignore un dashboard illisible :
      # on compare le nombre de dashboards charges au nombre de fichiers JSON
      - name: Verifier que les dashboards Grafana sont provisionnes
        run: |
          source .env
          expected=$(ls docker/grafana/dashboards/*.json | wc -l)
          for i in $(seq 1 10); do
            count=$(curl -fsk -u "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
              "https://localhost:8443/grafana/api/search?type=dash-db" | jq 'length')
            echo "dashboards charges : ${count:-0} / $expected (tentative $i/10)"
            if [ "${count:-0}" -ge "$expected" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Grafana n'a pas charge tous les dashboards"
          exit 1

      - name: Attendre la fin d'elk-setup (comptes, ILM, SLM, data view)
        run: |
          code=$(timeout 600 docker wait elk-setup || echo "timeout")
          echo "elk-setup est sorti avec le code : $code"
          if [ "$code" != "0" ]; then
            echo "::error::elk-setup a echoue ou n'a pas termine a temps"
            docker logs elk-setup
            exit 1
          fi

      - name: Verifier Kibana derriere nginx (HTTPS + sous-chemin + login kibana_user)
        run: |
          source .env
          curl -fsk --retry 5 --retry-delay 2 --retry-connrefused \
            -u "kibana_user:${KIBANA_USER_PASSWORD}" \
            https://localhost:8443/kibana/api/status -o /dev/null

      - name: Verifier le pipeline de logs bout-en-bout (nginx -> Logstash -> Elasticsearch)
        run: |
          source .env
          for i in $(seq 1 30); do
            curl -fsk https://localhost:8443/ -o /dev/null || true
            count=$(docker exec elasticsearch curl -fsS -u "elastic:${ELASTIC_PASSWORD}" \
              "localhost:9200/transcendence-logs*/_count" \
              | grep -o '"count":[0-9]*' | cut -d: -f2)
            echo "documents indexes : ${count:-0} (tentative $i/30)"
            if [ "${count:-0}" -gt 0 ]; then
              echo "Le pipeline de logs fonctionne"
              exit 0
            fi
            sleep 5
          done
          echo "::error::aucun log n'est arrive dans Elasticsearch"
          docker logs logstash --tail 50
          exit 1

      - name: Verifier les sondes blackbox dans Prometheus (probe_success)
        run: |
          for i in $(seq 1 20); do
            if docker exec prometheus wget -qO- 'localhost:9090/api/v1/query?query=probe_success' \
               | jq -e '(.data.result | length) >= 3 and (.data.result | all(.value[1] == "1"))' > /dev/null; then
              echo "Next, Logstash et Kibana repondent aux sondes blackbox"
              exit 0
            fi
            echo "Sondes pas encore toutes vertes (tentative $i/20)"
            sleep 3
          done
          echo "::error::Des sondes blackbox restent en echec"
          docker exec prometheus wget -qO- 'localhost:9090/api/v1/query?query=probe_success' | jq .
          exit 1

      - name: Logs en cas d'echec
        if: failure()
        run: docker compose logs

      - name: Arreter la stack
        if: always()
        run: docker compose down -v
