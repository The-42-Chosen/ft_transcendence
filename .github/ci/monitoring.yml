# Override CI du job "monitoring" : prometheus + grafana + exporters + nginx.
# Next et Kibana sont remplaces par des stubs pour que nginx demarre.
services:
  next:
    image: docker.io/traefik/whoami:v1.10
    command: ["--port", "3000"]
    build: !reset null
    healthcheck: !reset null
    environment: !reset {}

  kibana:
    image: docker.io/traefik/whoami:v1.10
    command: ["--port", "5601"]
    environment: !reset {}
    depends_on: !reset []
