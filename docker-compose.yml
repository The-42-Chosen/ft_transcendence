name: transcendence

services:
  postgres:
    build:
      context: ./docker/postgres
    container_name: postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-transcendence}"
      POSTGRES_USER: "${POSTGRES_USER:-transcendence}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_MONITORING_PASSWORD: "${POSTGRES_MONITORING_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcendence
    restart: unless-stopped

  nginx:
    build:
      context: ./docker/nginx
    container_name: nginx
    environment:
      NGINX_SSL_PORT: "${NGINX_SSL_PORT:-8443}"
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/html:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - grafana
      - kibana
    networks:
      - transcendence
    restart: unless-stopped

  # ------------------------------------------------------------------
  # ELK
  # ------------------------------------------------------------------

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.17.4}
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD}"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      node.store.allow_mmap: "false"
      path.repo: /usr/share/elasticsearch/data/snapshots
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - transcendence
    restart: unless-stopped

  # Conteneur temporaire : attend ES puis pousse toute la configuration par API
  # (mots de passe, role Logstash, politique ILM, snapshots + SLM), puis s'arrete.
  elk-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.17.4}
    container_name: elk-setup
    environment:
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD}"
      KIBANA_SYSTEM_PASSWORD: "${KIBANA_SYSTEM_PASSWORD}"
      LOGSTASH_INTERNAL_PASSWORD: "${LOGSTASH_INTERNAL_PASSWORD}"
      KIBANA_USER_PASSWORD: "${KIBANA_USER_PASSWORD}"
      ES_MONITORING_PASSWORD: "${ES_MONITORING_PASSWORD}"
    volumes:
      - ./docker/elk/setup/setup.sh:/setup.sh:ro
    entrypoint: ["bash", "/setup.sh"]
    depends_on:
      - elasticsearch
    networks:
      - transcendence
    restart: "no"

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-8.17.4}
    container_name: logstash
    environment:
      LOGSTASH_INTERNAL_PASSWORD: "${LOGSTASH_INTERNAL_PASSWORD}"
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./docker/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - nginx_logs:/var/log/nginx:ro
      - logstash_data:/usr/share/logstash/data
    depends_on:
      - elasticsearch
      - elk-setup
    networks:
      - transcendence
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-8.17.4}
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: "${KIBANA_SYSTEM_PASSWORD}"
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: "https://localhost:${NGINX_SSL_PORT:-8443}/kibana"
      XPACK_SECURITY_ENCRYPTIONKEY: "${KIBANA_ENCRYPTION_KEY}"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "${KIBANA_ENCRYPTION_KEY}"
      XPACK_REPORTING_ENCRYPTIONKEY: "${KIBANA_ENCRYPTION_KEY}"
    depends_on:
      - elasticsearch
      - elk-setup
    networks:
      - transcendence
    restart: unless-stopped

  # ------------------------------------------------------------------
  # PROMETHEUS + GRAFANA
  # ------------------------------------------------------------------

  prometheus:
    image: docker.io/prom/prometheus:v3.2.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - transcendence
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.6.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://localhost:${NGINX_SSL_PORT:-8443}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - transcendence
    restart: unless-stopped

  node-exporter:
    image: docker.io/prom/node-exporter:v1.9.0
    container_name: node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - transcendence
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ${XDG_RUNTIME_DIR:-/tmp}/podman/podman.sock:/var/run/podman/podman.sock:ro
    networks:
      - transcendence
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring:${POSTGRES_MONITORING_PASSWORD}@postgres:5432/${POSTGRES_DB:-transcendence}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence
    restart: unless-stopped

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
    depends_on:
      - nginx
    networks:
      - transcendence
    restart: unless-stopped

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
    container_name: elasticsearch-exporter
    command:
      - "--es.uri=http://elasticsearch:9200"
      - "--es.indices"
    environment:
      ES_USERNAME: monitoring_internal
      ES_PASSWORD: "${ES_MONITORING_PASSWORD}"
    depends_on:
      - elasticsearch
      - elk-setup
    networks:
      - transcendence
    restart: unless-stopped

  # Logstash et Kibana exporter
  blackbox-exporter:
    image: docker.io/prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    depends_on:
      - logstash
      - kibana
    networks:
      - transcendence
    restart: unless-stopped

  # ------------------------------------------------------------------
  # FIN PROMETHEUS + GRAFANA
  # ------------------------------------------------------------------

networks:
  transcendence:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  es_data:
  logstash_data:
  nginx_logs:
