name: transcendence

services:
  postgres:
    build:
      context: ./docker/postgres
    container_name: postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-transcendence}"
      POSTGRES_USER: "${POSTGRES_USER:-transcendence}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_MONITORING_PASSWORD: "${POSTGRES_MONITORING_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcendence
    restart: unless-stopped

  nginx:
    build:
      context: ./docker/nginx
    container_name: nginx
    environment:
      NGINX_SSL_PORT: "${NGINX_SSL_PORT:-8443}"
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - grafana
    networks:
      - transcendence
    restart: unless-stopped

  # ------------------------------------------------------------------
  # PROMETHEUS + GRAFANA
  # ------------------------------------------------------------------

  prometheus:
    image: docker.io/prom/prometheus:v3.2.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - transcendence
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.6.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://localhost:${NGINX_SSL_PORT:-8443}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - transcendence
    restart: unless-stopped

  node-exporter:
    image: docker.io/prom/node-exporter:v1.9.0
    container_name: node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - transcendence
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ${XDG_RUNTIME_DIR:-/tmp}/podman/podman.sock:/var/run/podman/podman.sock:ro
    networks:
      - transcendence
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring:${POSTGRES_MONITORING_PASSWORD}@postgres:5432/${POSTGRES_DB:-transcendence}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence
    restart: unless-stopped

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
    depends_on:
      - nginx
    networks:
      - transcendence
    restart: unless-stopped

  # ------------------------------------------------------------------
  # FIN PROMETHEUS + GRAFANA
  # ------------------------------------------------------------------

networks:
  transcendence:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
